  dast-base-scan:
    name: DAST Base Analysis
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zaproxy/zaproxy:latest
      options: --user root
    
    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Install Java 21
      run: |
        apt-get update
        apt-get install -y wget
        cd /opt
        wget https://download.java.net/java/GA/jdk21.0.2/f2283984656d49d69e91c558476027ac/13/GPL/openjdk-21.0.2_linux-x64_bin.tar.gz
        tar -xzf openjdk-21.0.2_linux-x64_bin.tar.gz
        export JAVA_HOME=/opt/jdk-21.0.2
        export PATH=$JAVA_HOME/bin:$PATH
        java -version

    - name: Download app
      uses: actions/download-artifact@v4
      with:
        name: java-app

    - name: Make Directory
    - run: mkdir -p /zap/wrk/

    - name: Zap baseline scan
    - run: /opt/jdk-21.0.2/bin/java -jar ./rpbo_1-0.0.1-SNAPSHOT.jar & sleep 30
    - run: zap-baseline.py -t http://localhost:8080 -r report_site.html || true
    - run: cp /zap/wrk/report_site.html report_site.html

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zap-base-report
        path: ./report_site.html
        retention-days: 14


  dast-api-scan:
    name: DAST API Analysis
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zaproxy/zaproxy:latest
      options: --user root

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Install Java 21
      run: |
        apt-get update
        apt-get install -y wget
        cd /opt
        wget https://download.java.net/java/GA/jdk21.0.2/f2283984656d49d69e91c558476027ac/13/GPL/openjdk-21.0.2_linux-x64_bin.tar.gz
        tar -xzf openjdk-21.0.2_linux-x64_bin.tar.gz
        export JAVA_HOME=/opt/jdk-21.0.2
        export PATH=$JAVA_HOME/bin:$PATH
        java -version

    - name: Download app
      uses: actions/download-artifact@v4
      with:
        name: java-app

    - name: Make directory
      run: mkdir -p /zap/wrk/

    - name: Zap-api scan
    - run: /opt/jdk-21.0.2/bin/java -jar ./rpbo_1-0.0.1-0.0.1-SNAPSHOT.jar & sleep 30
    - run: zap-api-scan.py -t http://localhost:8080 -f openapi -r report_site.html || true
    - run: cp /zap/wrk/report_site.html report_site.html

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zap-api-report
        path: ./report_site.html
        retention-days: 14