on:
    pull_request:
        types:    [opened, synchronize]
        branches: [ main ]

jobs:
    build:
        runs-on: ubuntu-latest
        container: eclipse-temurin:21-jdk

        steps:
            - name: Clone repository
              uses: actions/checkout@v4

            - name: Grant permissions to mvnw script
              run: chmod u+x ./mvnw

            - name: Run mvnw script
              run: ./mvnw clean package

            - name: Save artifacts
              uses: actions/upload-artifact@v4
              with:
                 name: rbpo_1
                 path: ./target/*.jar
                 retention-days: 14

    sast-task:
             name: SAST task
             needs: build
             runs-on: ubuntu-latest
             container:
               image: returntocorp/semgrep:latest
    
             steps:
             - name: Clone repository
               uses: actions/checkout@v4
          
             - name: Make directory
               run: mkdir -p reports

             - name: Run Semgrep Scan
               run: |
                 semgrep scan \
                   --config "p/java" \
                   --config "p/secrets" \
                   --config "p/owasp-top-ten" \
                   --output reports/semgrep-results.sarif \
                   --sarif || true

             - name: Save SARIF
               uses: github/codeql-action/upload-sarif@v4
               with:
                 sarif_file: reports/semgrep-results.sarif

             - name: Save results
               uses: actions/upload-artifact@v4
               with:
                 name: semgrep-results
                 path: reports/semgrep-results.sarif
                 retention-days: 14

    sca_task:
             name: SCA Task
             needs: build
             runs-on: ubuntu-latest
             container: eclipse-temurin:21-jdk
             steps:
             - name: Clone repository
               uses: actions/checkout@v4
        
             - name: Make directory
               run: mkdir -p reports

             - name: Grant permissions to mvnw script
               run: chmod +x ./mvnw

             - name: Run OWASP Dependency-Check
               run: |
                 ./mvnw org.owasp:dependency-check-maven:check \
                 -Dformat=HTML \
                 -DoutputDirectory=reports \
                 -DsuppressionFile=suppressions.xml || true

             - name: Save reports
               uses: actions/upload-artifact@v4
               with:
                 name: reports-owasp
                 path: target/dependency-check-report.html
                 retention-days: 14

    zap-baseline_scan:
        name: ZAP Baseline task
        needs: build
        runs-on: ubuntu-latest
        
        steps:
        - name: Clone repository
          uses: actions/checkout@v4
    
        - name: Install Java
          uses: actions/setup-java@v4
          with:
              java-version: '21'
              distribution: 'temurin'

        - name: Prepare ZAP Environment
          run: |
              sudo mkdir -p /zap/wrk
              sudo chown -R $USER:$USER /zap
              sudo chmod -R 755 /zap
    
        - name: Download app
          uses: actions/download-artifact@v4
          with:
            name: rbpo_1
            path: target/

        - name: Run application
          run: java -jar target/course-management-0.0.1-SNAPSHOT.jar &
      
        - name: Wait for application to start
          run: sleep 30
    
        - name: ZAP Baseline scan
          uses: zaproxy/action-baseline@v0.9.0
          with:
              token: ${{ secrets.GITHUB_TOKEN }}
              docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
              target: 'http://localhost:8080'
              rules_file_name: 'zap_rules.tsv'
              allow_issue_writing: false
              fail_action: false
              artifact_name: ''
    
        - name: Upload ZAP Results
          if: always()
          uses: actions/upload-artifact@v4
          with:
              name: zap-baseline_results
              path: |
                zap-*
                *.html
              retention-days: 14


    zap-api_scan:
        name: ZAP API task
        needs: build
        runs-on: ubuntu-latest
    
        steps:
        - name: Clone repository
          uses: actions/checkout@v4
    
        - name: Install Java
          uses: actions/setup-java@v4
          with:
              java-version: '21'
              distribution: 'temurin'
    
        - name: Prepare ZAP Environment
          run: |
              sudo mkdir -p /zap/wrk
              sudo chown -R $USER:$USER /zap
              sudo chmod -R 755 /zap
    
        - name: Download app
          uses: actions/download-artifact@v4
          with:
            name: rbpo_1
            path: target/

        - name: Run application
          run: java -jar target/course-management-0.0.1-SNAPSHOT.jar &
      
        - name: Wait for application to start
          run: sleep 30
    
        - name: ZAP-API Scan
          uses: zaproxy/action-api-scan@v0.10.0
          with:
              token: ${{ secrets.GITHUB_TOKEN }}
              docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
              format: openapi
              target: 'http://localhost:8080/v3/api-docs'
              rules_file_name: 'zap_rules.tsv'
              allow_issue_writing: false
              fail_action: false
              artifact_name: zap_api_scan

        - name: Upload ZAP Results
          if: always()
          uses: actions/upload-artifact@v4
          with:
              name: zap-api_results
              path: |
                zap-*
                *.html
              retention-days: 14
